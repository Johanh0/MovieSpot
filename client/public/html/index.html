<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="js/script.js" type="module" defer></script>
    <link rel="stylesheet" href="../css/styles.css" />
    <title>MovieSpot</title>
  </head>
  <body>
    <main>
      <section class="search">
        <form action="" class="form">
          <div class="form__search">
            <img src="../assets/icons/search-icon.svg" alt="Search icon" />
            <input type="search" value="" id="search__input" />
          </div>
          <div class="form__categories">
            <select name="changes" id="select__genres">
              <option value="">All Categories</option>
              <option value="28">Action</option>
              <option value="12">Adventure</option>
              <option value="16">Animation</option>
              <option value="35">Comedy</option>
              <option value="80">Crime</option>
              <option value="99">Documentary</option>
              <option value="18">Drama</option>
              <option value="10751">Family</option>
              <option value="14">Fantasy</option>
              <option value="36">History</option>
              <option value="27">Horror</option>
              <option value="10402">Music</option>
              <option value="9648">Mystery</option>
              <option value="10749">Romance</option>
              <option value="878">Science Fiction</option>
              <option value="10770">TV Movie</option>
              <option value="53">Thriller</option>
              <option value="10752">War</option>
              <option value="37">Western</option>
            </select>
          </div>
          <div class="form__submit">
            <input type="submit" />
          </div>
        </form>

        <div class="search--container">
          <div class="trending__title">
            <h2>Top Trending Movies</h2>
          </div>

          <div class="trending--container">
            <div class="trending__video"></div>
            <div class="trending__list"></div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>Made by <a href="https://github.com/Johanh0">Johanh0</a></p>
    </footer>
  </body>
</html>
